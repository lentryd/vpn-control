# Runs next to the Remnawave panel in its docker network, served by the
# panel's Traefik at https://$APP_DOMAIN/.
# Behind frp add compose.frp.yml: COMPOSE_FILE=compose.yml:compose.frp.yml.
services:
    vpn-control:
        build: .
        image: vpn-control:latest
        container_name: vpn-control
        hostname: vpn-control
        restart: unless-stopped
        ports:
            - '${HOST_PORT:-8080}:8080'
        env_file:
            - .env
        # Container-side values; they override the local ones from .env.
        environment:
            PORT: 8080
            DB_PATH: /data/vpn-control.db
            ADDONS_CONFIG: /etc/vpn-control/addons.yml
        volumes:
            - vpn-control-data:/data
            # Optional add-ons file (e.g. subpage's); add-ons can also be
            # managed in the UI. A missing file means none.
            - ${ADDONS_FILE:-./addons.yml}:/etc/vpn-control/addons.yml:ro
        networks:
            - remnawave-network
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.vpn-control.rule=Host(`${APP_DOMAIN}`)'
            - 'traefik.http.routers.vpn-control.tls=true'
            - 'traefik.http.routers.vpn-control.entrypoints=${TRAEFIK_ENTRYPOINTS:-web,websecure}'
            - 'traefik.http.routers.vpn-control.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.services.vpn-control.loadbalancer.server.port=8080'

volumes:
    vpn-control-data:

networks:
    remnawave-network:
        name: ${REMNAWAVE_NETWORK:-remnawave-network}
        driver: bridge
        external: true
