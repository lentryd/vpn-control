<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
        <!-- no auto-zoom on input focus on iOS, which made open dropdowns
             jump around while the page rescaled -->
        <meta name="viewport" content="minimum-scale=1, initial-scale=1, maximum-scale=1, width=device-width, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
        <title>VPN Control</title>
        <script>
            // Apply the saved colour scheme before the first paint (no flash).
            try {
                var s = localStorage.getItem('mantine-color-scheme-value') || 'auto'
                if (s === 'auto') s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                document.documentElement.setAttribute('data-mantine-color-scheme', s)
            } catch (e) {
                document.documentElement.setAttribute('data-mantine-color-scheme', 'dark')
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
