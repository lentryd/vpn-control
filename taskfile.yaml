version: "3"

output: prefixed

dotenv: [".env"]

env:
  CGO_ENABLED: 0

tasks:
  init:
    desc: First-time setup — .env and frontend deps
    cmds:
      - test -f .env || cp .env.example .env
      - task: web:install

  dev:
    desc: API (no embedded SPA) and the Bun dev server together
    deps: [dev:api, dev:web]

  dev:api:
    desc: Run the API locally
    cmds:
      - go run . --no-web --debug

  dev:web:
    desc: Run the frontend dev server (proxies /api to :8080)
    dir: web
    cmds: [bun run dev]

  ent:generate:
    desc: Regenerate the Ent client after editing ent/schema/*.go
    cmds:
      - go generate ./ent/...

  web:install:
    dir: web
    status:
      - test -d node_modules
    cmds: [bun install]

  web:build:
    dir: web
    cmds:
      - bun run build
      - touch dist/.gitkeep

  build:
    desc: Build the binary (embeds the built frontend)
    deps: [web:build]
    cmds:
      - go build -ldflags="-s -w" -trimpath -o bin/vpn-control .

  test:
    desc: Go tests and frontend typecheck
    cmds:
      - go test -cover ./...
      - cd web && bun run typecheck

  lint:
    desc: Format, vet and tidy the Go module
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - golangci-lint run

  docker:
    desc: Build a local test image (ko.local/vpn-control) with ko
    deps: [web:build]
    env:
      KO_DOCKER_REPO: ko.local/vpn-control
      KO_DEFAULTBASEIMAGE: alpine
    cmds:
      - ko build . --bare --tags=dev

  snapshot:
    desc: Build a local release snapshot with goreleaser (no publish)
    deps: [web:build]
    cmds:
      - goreleaser release --snapshot --clean --skip=validate,publish,sign,sbom

  release:
    desc: Cut a release with goreleaser (CI does it on a v* tag)
    deps: [web:build]
    cmds:
      - goreleaser release --clean --skip=validate

