# For a Traefik that reaches this host through frp: HOST_PORT is tunnelled
# to 1${HOST_PORT} on the Traefik side. Enable with
# COMPOSE_FILE=compose.yml:compose.frp.yml in .env.
services:
    vpn-control:
        labels:
            - 'traefik.http.services.vpn-control.loadbalancer.server.port=1${HOST_PORT:-8080}'
            - 'frp.enable=true'
            - 'frp.name=vpn-control'
            - 'frp.local_port=${HOST_PORT:-8080}'
            - 'frp.remote_port=1${HOST_PORT:-8080}'
